name: Read-only plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run offline unit tests
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile bin/omarchy-guard bin/omarchy-guard-evidence
          python3 -m json.tool manifest.json > /dev/null
          bash -n scripts/check.sh scripts/install-local.sh
      - name: Validate evidence schema independently
        run: |
          python3 -m venv "$RUNNER_TEMP/guard-schema-venv"
          "$RUNNER_TEMP/guard-schema-venv/bin/python" -m pip install -r requirements-schema.txt
          "$RUNNER_TEMP/guard-schema-venv/bin/python" -B tests/schema_contract.py
