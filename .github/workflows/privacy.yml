name: Privacy guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: privacy-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout untrusted proposal without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Required to inspect removed files in intermediate PR commits
      - name: Check tracked files and all introduced Git blobs for accidental disclosure
        env:
          PRIVACY_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          PRIVACY_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/privacy_guard.py
      - name: Exercise privacy detection fixtures
        run: python3 -m unittest discover -s tests -p 'test_privacy_guard.py' -v
